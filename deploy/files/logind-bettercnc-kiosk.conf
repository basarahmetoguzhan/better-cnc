# Installed by deploy/kiosk.sh as /etc/systemd/logind.conf.d/90-bettercnc-kiosk.conf.
# The controller must not go to sleep under a running machine: closing the
# test rig laptop's lid, or a suspend/hibernate key, would stop LinuxCNC
# mid-job. The power key keeps its default (a clean poweroff).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
