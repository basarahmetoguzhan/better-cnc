<!doctype html>
<!--
  The kiosk's "please wait" screen, shown in place of any page of Chromium's
  own: a crashed tab ("Aw, Snap"), a connection error, a blocked page.
  bettercnc.browserwatch opens it; deploy/kiosk.sh installs it as
  /usr/share/bettercnc/wait.html, the one file:// URL the Chromium policy
  allows. It needs no server - it is shown precisely when ours may be down -
  so it is self-contained and has no script: browserwatch takes the screen
  back to the boot screen as soon as that answers.
  data-bettercnc and the "better-cnc · " title mark it as ours.
-->
<html lang="tr" translate="no" data-bettercnc="bekleme">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>better-cnc · bekleyin</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #161826; color: #e9e9ed; cursor: default;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-user-select: none; user-select: none; }
  main { max-width: 760px; padding: 24px; text-align: center; }
  h1 { font-size: 14px; letter-spacing: .12em; color: #9397ab; font-weight: 600; margin: 0 0 16px; }
  .msg { font-size: 22px; }
  .sub { margin-top: 8px; color: #9397ab; }
  .hint { margin-top: 20px; color: #f0a92b; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>BETTER-CNC</h1>
  <div class="msg">Bir hata oluştu — lütfen bekleyin.</div>
  <div class="sub">Ekran kendiliğinden geri gelecek.</div>
  <div class="hint">Acil durumda makinenin gücünü kesin.</div>
</main>
</body>
</html>
