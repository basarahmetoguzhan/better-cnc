# =============================================================================
# test-rig.ini - Phase 1.5 test machine: 3-axis DIY wooden-frame router
# =============================================================================
#
#   *** UNTESTED DRAFT. NOT YET RUN ON THE MACHINE. ***
#
# The BOARD is now fully interrogated (2026-08-05) - the HAL prefix, the module
# inventory and every stepgen pin assignment are VERIFIED against the dumps in
# docs/board-dumps/. What remains unverified is the MACHINE: travel limits,
# homing directions, which sensor is at which end, and switch polarity.
#
#   grep -rn 'ASSUMPTION:' configs/test-rig/
#
# 7 markers remain (3 travel limits, 3 homing directions, 1 switch mapping in
# the HAL) covering 3 open questions - A5, A6, A7 in README.md. All are about
# the machine, none about the board.
#
# First run MUST be with the motors mechanically uncoupled. See README.md.
#
# Hardware:
#   Motors   Japan Servo KH42KM2, NEMA 17, 1.8 deg, 200 steps/rev
#   Drivers  TB6560, one per axis (docs/09)
#   Board    Zhulong V2.0 - a Mesa **7i92** derivative, hm2_eth. 34 IO pins.
#            (docs/10 has the verified pin map; docs/04 and docs/08 predate
#            the dumps and called it a 7i96 - that was WRONG, see [HOSTMOT2])
#
# Provenance convention: every value below carries a comment saying where it
# came from. A value with no provenance is a bug - report it.
#
# INI key names and units verified against:
#   reference/linuxcnc/docs/src/config/ini-config.adoc
#   reference/linuxcnc/docs/src/config/ini-homing.adoc
# Line citations are given inline as (ini-config.adoc:NNN).
# =============================================================================


# -----------------------------------------------------------------------------
[EMC]
# Section documented at ini-config.adoc:223
# -----------------------------------------------------------------------------
MACHINE = test-rig
VERSION = 1.0
DEBUG = 0


# -----------------------------------------------------------------------------
[DISPLAY]
# Section documented at ini-config.adoc:234
# -----------------------------------------------------------------------------
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL

# Jog/override defaults. Deliberately slow for first commissioning.
MAX_FEED_OVERRIDE = 1.0
# DEFAULT_LINEAR_VELOCITY: initial jog rate, machine units per SECOND
#   (ini-config.adoc:856). 1 mm/s is a walking-pace crawl - intentional.
DEFAULT_LINEAR_VELOCITY = 1.0
# MAX_LINEAR_VELOCITY: maximum jog rate, machine units per SECOND
#   (ini-config.adoc:315). Matches the joint ceiling set below.
MAX_LINEAR_VELOCITY = 3.0

PROGRAM_PREFIX = ../../nc_files/


# -----------------------------------------------------------------------------
[RS274NGC]
# Section documented at ini-config.adoc:500
# -----------------------------------------------------------------------------
PARAMETER_FILE = test-rig.var


# -----------------------------------------------------------------------------
[EMCMOT]
# Section documented at ini-config.adoc:588
# -----------------------------------------------------------------------------
EMCMOT = motmod
COMM_TIMEOUT = 1.0
# SERVO_PERIOD in NANOSECONDS (ini-config.adoc:597). 1000000 ns = 1 ms,
# as specified. No base thread: step pulses come from the FPGA, not software,
# so there is nothing for a fast thread to do (docs/05 section b).
SERVO_PERIOD = 1000000


# -----------------------------------------------------------------------------
[TASK]
# Section documented at ini-config.adoc:606
# -----------------------------------------------------------------------------
TASK = milltask
CYCLE_TIME = 0.010


# -----------------------------------------------------------------------------
[HAL]
# Section documented at ini-config.adoc:622
# -----------------------------------------------------------------------------
HALFILE = test-rig.hal


# -----------------------------------------------------------------------------
[HOSTMOT2]
# Custom section - LinuxCNC does not parse this. The HAL file reads these
# values. Custom sections/variables are documented at ini-config.adoc:128-166.
# -----------------------------------------------------------------------------
DRIVER = hm2_eth

# RESOLVED (was assumption A1). The board answers at this address - both dumps
#   in docs/board-dumps/ were taken from it:
#     mesaflash --device 7i92 --addr 10.10.10.10 --readhmid
#   Source: docs/board-dumps/readhmid-10.10.10.10-2026-08-05.txt:1
BOARD_IP = 10.10.10.10

# RESOLVED (was assumption A2). The board is a 7i92 derivative, NOT a 7i96.
#
#   *** THIS IS A CORRECTION TO WHAT WE PREVIOUSLY WROTE. ***
#   Everything before 2026-08-05 in this repo assumed a 7i96 derivative, on the
#   strength of the FPGA part number and the six AXIS connectors. That was
#   wrong. The board identifies itself as "7I92" over LBP16 (raw reply
#   37 49 39 32 00 ... = "7I92") and its IDROM says BoardName MESA7I92.
#   mesaflash --device 7i96 fails outright with "no 7I96 board found".
#   Source: docs/board-dumps/readhmid-10.10.10.10-2026-08-05.txt:4-6, :12
#
#   hm2_eth handles "7I92" at hm2_eth.c:1183 with num_ioport_connectors = 2 and
#   pins_per_connector = 17, i.e. 34 IO pins on connectors named P2 and P1
#   (hm2_eth.c:1187-1190). The IDROM agrees - "Number of IO Ports: 2",
#   "Width of one I/O port: 17" (readhmid:15-16) - so the strict geometry checks
#   in hm2_read_idrom() pass and the board loads on the clean exact-match path.
#   That is Outcome A of docs/02, not the fallback.
#
#   The HAL prefix is therefore hm2_7i92.0.
BOARD = 7i92

# RESOLVED (was assumption A3). Module inventory is now known exactly, from
#   docs/board-dumps/readhmid-10.10.10.10-2026-08-05.txt:25-97 and the pin
#   descriptors in printpd-10.10.10.10-2026-08-05.txt.
#
#   Firmware provides:  6 StepGen, 3 QCount(encoder), 1 PWM, 1 SSerial
#                       (2 channels), 1 LED, 1 WatchDog, 1 DPLL, 2 IOPort
#
#   Note "QCount" is the HostMot2 firmware's name for the module the LinuxCNC
#   driver calls "Encoder" - same thing, gtag 0x04 (hostmot2.h:96). The config
#   parameter is num_encoders.
#
#   We want 3 stepgens and nothing else. What each setting does, and which IO
#   pins it releases to plain GPIO - pins are freed because an IO pin whose
#   owning module is not instantiated falls back to full GPIO
#   (hostmot2.adoc:400-401):
#
#     num_stepgens=3            keeps StepGen 0,1,2 (IO 4-9), disables 3,4,5
#                               -> frees IO 10,11,12,13,14,15   (6 pins)
#     num_encoders=0            disables all 3 QCount instances
#                               -> frees IO 25-33                (9 pins)
#     num_pwmgens=0             disables the single PWM instance
#                               -> frees IO 16                   (1 pin)
#     sserial_port_0=xxxxxxxx   disables all SSerial channels
#                               -> frees IO 0,1,2,3              (4 pins)
#
#   Total freed: 20 pins. Plus IO 17-24, which have NO secondary tag at all in
#   the pin descriptors (printpd:94-109) and are therefore permanently GPIO -
#   8 pins. So 28 of the 34 IO pins are available as GPIO, and 6 are consumed
#   by the three stepgens we keep. 6 + 28 = 34. Checks out.
#
#   *** CORRECTION to the task brief: sserial_port_0=00000000 does NOT disable
#   SSerial - it ENABLES all 8 channels in mode 0, and is in fact the documented
#   default (hostmot2.9:176 "default: 00000000 for all ports").
#
#   The disable character is a lowercase "x". From hostmot2.9:183-184:
#     "A "0" in the string sets the corresponding channel to mode 0, a "1" to
#      mode 1, and so on up to mode 9. An "x" in any position disables that
#      channel and makes the corresponding FPGA pins available as GPIO."
#
#   Confirmed in the parser at hostmot2.c:490-498, which accepts ONLY '0'-'9'
#   and lowercase 'x' and silently ignores every other character - so the
#   uppercase "0XXX" used in the examples at hostmot2.adoc:727,737 would parse
#   as just "0" with the X's dropped. Use lowercase. sserial.c then treats any
#   channel whose mode character is not 'x' as active (sserial.c:250, :640,
#   :705, :755, :767, :2153).
#
#   A useful side effect: the parser only raises num_sserials above 0 if it saw
#   a DIGIT (the `flag` variable, hostmot2.c:493 and :505-507). An all-'x'
#   string leaves it at 0, so the module is not instantiated at all. There is no
#   num_sserials= config parameter to do this directly - it exists only as an
#   internal field - so sserial_port_0=xxxxxxxx is the way.
#
#   Only 2 channels exist on this board, and hostmot2.9:185 says extra mode
#   characters beyond the channel count are ignored, so 8 x's is harmless.
#
#   hostmot2.9:188-189 explains why disabling matters rather than just leaving
#   it: "Unconnected channels will default to GPIO, but the pin values will vary
#   semi-randomly during boot when card-detection runs, so it is best to
#   actively disable any channel that is to be used for GPIO."
CONFIG = "num_stepgens=3 num_encoders=0 num_pwmgens=0 sserial_port_0=xxxxxxxx"


# -----------------------------------------------------------------------------
[KINS]
# Section documented at ini-config.adoc:893
# -----------------------------------------------------------------------------
# trivkins gives a 1:1 joint-to-axis mapping: JOINT_0=X, JOINT_1=Y, JOINT_2=Z
# (ini-config.adoc:900). JOINTS counts motors (ini-config.adoc:896).
KINEMATICS = trivkins
JOINTS = 3


# -----------------------------------------------------------------------------
[TRAJ]
# Section documented at ini-config.adoc:746
# -----------------------------------------------------------------------------
# COORDINATES names the axes (ini-config.adoc:844)
COORDINATES = X Y Z
# LINEAR_UNITS defines the machine units (ini-config.adoc:850). The machine was
# calibrated in mm under GRBL (docs/07), so mm throughout. Every velocity,
# acceleration, limit and scale value in this file is therefore in mm.
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
# MAX_LINEAR_VELOCITY: machine-wide ceiling for any coordinated move, in
# machine units per SECOND (ini-config.adoc:859). Set to the per-axis first-run
# ceiling; see the velocity note in [JOINT_0].
MAX_LINEAR_VELOCITY = 3.0
DEFAULT_LINEAR_VELOCITY = 1.0


# -----------------------------------------------------------------------------
[EMCIO]
# Section documented at ini-config.adoc:1366
# -----------------------------------------------------------------------------
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl


# =============================================================================
# VELOCITY AND ACCELERATION - read this before raising any number
# =============================================================================
#
# MAX_VELOCITY below is 3 mm/s on every axis. That is deliberately far below
# what the hardware can do, because nothing has been validated yet.
#
# The eventual target, once step timing is scope-verified and the machine has
# been run: the TB6560 is rated 15 kHz maximum STEP frequency (docs/09). That
# is a limit of the DRIVER BOARD, not of the motor or the mechanics. Applying a
# 20 % margin (12 kHz) against the calibrated SCALE values gives:
#
#     axis   SCALE steps/mm   ceiling at 12 kHz   mm/min
#     X          833.3            14.4 mm/s         864
#     Y          823.5            14.6 mm/s         874
#     Z         1250.0             9.6 mm/s         576
#
# Those are the numbers to work up toward - NOT to start with. Note the machine
# ran at 500 mm/min under GRBL, so the headroom is modest; Z barely improves.
# The 15 kHz figure is the manufacturer's and is independently unverified
# (docs/09) - find the real ceiling empirically by raising speed until steps
# are lost.
#
# MAX_ACCELERATION is 10 mm/s^2, carried over unchanged from the machine's own
# GRBL setting ($120-122 = 10, docs/07). GRBL and LinuxCNC use the SAME units
# for acceleration - mm/sec^2 - so this value passes through with no conversion
# (docs/06 Trap 4). It is conservative and known to work on this machine.
# =============================================================================


# =============================================================================
# JOINTS
# =============================================================================
#
# Every joint below shares this reasoning; it is stated once here rather than
# three times.
#
# SCALE (steps per machine unit, ini-config.adoc:1280) comes from the machine's
#   own GRBL EEPROM, empirically calibrated by whoever built it - not a
#   factory default. Source: docs/board-dumps/grbl-eeprom-2026-08-03.json,
#   analysed in docs/07. All three are POSITIVE because GRBL's $3 (direction
#   invert mask) was 0, i.e. no axis was reversed.
#
#   On reversing an axis: hostmot2 stepgen has NO dirinvert parameter. The
#   parameter list is position-scale, maxvel, maxaccel, steplen, stepspace,
#   dirsetup, dirhold, step_type (hostmot2.adoc:509-537) plus a conditional
#   swap_step_dir. To reverse an axis, NEGATE SCALE here - position is
#   counts / position_scale (hostmot2.adoc:525-526), so a negative scale
#   reverses travel. Do that rather than inverting the direction pin in HAL;
#   the sign is visible here, a HAL setp is not.
#
# STEPGEN_MAX_VEL / STEPGEN_MAX_ACC are headroom for the stepgen's internal
#   position loop, set ~20 % above the joint limits. The docs advise 1-10 %
#   (ini-config.adoc:1314-1320) but describe them as STEPGEN_MAXACCEL /
#   STEPGEN_MAXVEL; the shipped sample INI and HAL use STEPGEN_MAX_VEL and
#   STEPGEN_MAX_ACC (7i96s.ini:110-111, hm2-stepper-eth.hal:89-90). These are
#   custom variables, so the spelling only has to match the HAL file - and
#   test-rig.hal uses the sample spelling. 20 % is used because these are
#   absurdly small absolute numbers where 1 % is meaningless.
#
# FERROR / MIN_FERROR: 0.050 / 0.005 mm.
#   These are the values every upstream hm2-stepper sample uses
#   (7i96s.ini:117-118, and identically in 7i93.ini, 3x20-small.ini, 4i65.ini) -
#   i.e. the precedent for exactly this configuration type: hostmot2 hardware
#   stepgen, open loop.
#
#   FERROR is the maximum allowable following error in machine units
#   (ini-config.adoc:1063). MIN_FERROR being present makes the limit
#   velocity-proportional, ramping from MIN_FERROR at rest to FERROR at
#   [TRAJ]MAX_VELOCITY (ini-config.adoc:1058-1068).
#
#   WHY THESE SUIT A HARDWARE STEPGEN - and what they do NOT do:
#   position-fb for these joints does not come from an encoder. It comes from
#   the FPGA's own step accumulator (stepgen.c:117-120), which counts pulses
#   the FPGA actually emitted. So following error here measures the gap between
#   what motion commanded and what the stepgen managed to emit.
#
#   That means it CANNOT detect a stalled motor, a slipping coupling, or steps
#   the driver dropped - there is no independent measurement of the real axis.
#   Do not mistake a clean following-error record for proof the machine is
#   where it thinks it is.
#
#   What it DOES catch is the stepgen being commanded beyond its own configured
#   maxvel/maxaccel - a genuine configuration fault, and exactly the failure
#   mode of a first-draft config. Hence values tight enough to trip on that
#   (0.05 mm is ~42 steps on X) but loose enough to survive normal accumulator
#   quantisation.
#
# HOME_IGNORE_LIMITS = YES on all three joints.
#   Verified at ini-homing.adoc:168-176. Values are YES/NO, default NO
#   (ini-homing.adoc:171). "This flag determines whether LinuxCNC will ignore
#   the limit switch input for this joint while homing" (:172) and "If you do
#   not have a separate home switch set this to YES and connect the limit
#   switch signal to the joint home switch input in HAL" (:174) - which is
#   precisely our wiring: home and limit share one physical switch.
#
#   Two warnings from the same source:
#   - ":173  This setting will not ignore limit inputs for OTHER joints."
#     Combined with ":176  To use only one input for all homing and limits you
#     will have to block the limit signals of the joints not homing in HAL and
#     home one joint at a time." Our switches are on separate inputs per axis,
#     so per-joint blocking is not needed - but HOME_SEQUENCE still homes one
#     joint at a time.
#   - ":46  it is possible to start homing on the wrong side of the home
#     switch, which combined with HOME_IGNORE_LIMITS option will lead to a
#     HARD CRASH." Read that before the first homing attempt. With limits
#     ignored during homing there is nothing to stop the axis.
#
# HOME_SEQUENCE (ini-config.adoc:1112, ini-homing.adoc:248-267): Z first so the
#   tool lifts clear before X and Y move. Sequence numbers are positive, so
#   each joint homes independently and in order; negative values would
#   synchronise a final move, which is for gantries and not wanted here.
#
# TRAVEL LIMITS ARE PROVISIONAL - see the block at each joint.
# =============================================================================


# -----------------------------------------------------------------------------
[JOINT_0]
# X axis. Section keys documented from ini-config.adoc:984 onward.
# -----------------------------------------------------------------------------
# TYPE: LINEAR or ANGULAR (ini-config.adoc:984)
TYPE = LINEAR

# SCALE steps/mm (ini-config.adoc:1280). From GRBL $100 = 833.300,
# empirically calibrated. Positive: $3 = 0, no inversion. (docs/07)
SCALE = 833.300

# MAX_VELOCITY in machine units per SECOND (ini-config.adoc:988).
# First-run value, NOT the hardware ceiling of 14.4 mm/s. See the velocity
# block above.
MAX_VELOCITY = 3.0
# MAX_ACCELERATION in machine units per second SQUARED (ini-config.adoc:989).
# From GRBL $120 = 10, same units, no conversion (docs/06 Trap 4).
MAX_ACCELERATION = 10.0

# Stepgen headroom, ~20 % above the joint limits. Custom variables consumed by
# test-rig.hal. See the shared note above.
STEPGEN_MAX_VEL = 3.6
STEPGEN_MAX_ACC = 12.0

# BACKLASH in machine units (ini-config.adoc:990). Unmeasured on this machine;
# 0 means no compensation, which is honest rather than optimistic.
BACKLASH = 0.000

# Following error, mm. See the shared note above for why these suit an
# open-loop hardware stepgen and what they cannot detect.
FERROR = 0.050
MIN_FERROR = 0.005

# --- Soft limits: PROVISIONAL, MUST BE MEASURED --------------------------
# ASSUMPTION: 150 mm of usable X travel.
#   NOT derived from the machine. GRBL's $130 = 200 mm is an untouched factory
#   default (docs/07 line 76 shows $130-132 all still at 200 while the same
#   dump's SCALE values were clearly calibrated) - so it proves nothing about
#   this frame. 150 is a deliberately conservative under-estimate chosen so
#   that a wrong guess stops the axis short of the frame rather than into it.
#   Assumes homing at the minimum end with HOME_OFFSET = 0.
#   Resolved by: jog each axis end to end with limits disabled and measure the
#   actual travel with a rule, then set these to the measured value minus a
#   few mm of safety margin. Blocker T1 in docs/07.
# MIN_LIMIT / MAX_LIMIT in machine units (ini-config.adoc:1032, :1036)
MIN_LIMIT = 0.0
MAX_LIMIT = 150.0

# --- Step timing, nanoseconds -------------------------------------------
# Custom variables read by test-rig.hal. All four are nanoseconds
# (hostmot2.adoc:511-537). Values from the TB6560 datasheet analysis in
# docs/09 - GRBL has no equivalent settings for stepspace/dirsetup/dirhold,
# so these could not come from the EEPROM.
#
# CLOCK CORRECTION (2026-08-05): the StepGen module clock is 100 MHz, not the
#   33 MHz we previously assumed from the stock 7i96. IDROM reports
#   "Clock Low frequency: 100.0000 MHz" and the StepGen module's own
#   ClockFrequency line confirms 100.000 MHz
#   (readhmid-10.10.10.10-2026-08-05.txt:17, :68).
#
#   The NANOSECOND VALUES BELOW DO NOT CHANGE. The driver multiplies them by
#   the clock to get register counts (stepgen.c:348, :359, :370, :381), so ns
#   is the unit of intent and the clock is just the conversion factor. What
#   changes is the register values and the headroom:
#
#     at 100 MHz:  steplen 10000 ns -> 1000 counts,  dirsetup 50000 -> 5000
#                  register limit is 0x3FFF = 16383, so max is 163.8 us
#     at  33 MHz:  would have been    333 counts and 1666, max 491.5 us
#
#   Both fit comfortably. Our largest value (50 us) uses 31% of the range at
#   100 MHz, so there is no overflow risk and no clamp warning to expect.
#   Had we needed dirhold above ~164 us, 100 MHz would have been a real
#   constraint where 33 MHz was not - worth knowing, not an issue here.
DIRSETUP = 50000
DIRHOLD = 50000
STEPLEN = 10000
STEPSPACE = 10000

# --- Homing: sensor-to-end mapping NOT yet verified ---------------------
# ASSUMPTION: X homes toward the minimum end.
#   The sign of HOME_SEARCH_VEL sets the search direction
#   (ini-homing.adoc:137-138). Negative = toward minimum.
#
#   What IS now verified: IO 20 exists as a permanently-GPIO input pin - it has
#   NO secondary tag at all in the pin descriptors, so it can never be anything
#   but GPIO (printpd-10.10.10.10-2026-08-05.txt:100-101). Its HAL pin is
#   hm2_7i92.0.gpio.020.in and the vendor silkscreen "20" is that global IO
#   number, as docs/08 hypothesised.
#
#   What is STILL UNVERIFIED: which physical end of the X axis that sensor sits
#   at. The dumps describe the FPGA, not the frame.
#   Resolved by: watch halmeter on hm2_7i92.0.gpio.020.in while pushing each
#   axis end by hand, with the machine powered but not enabled.
# HOME_SEARCH_VEL / HOME_LATCH_VEL in machine units per SECOND
#   (ini-config.adoc:1083, :1087). Slow because untested.
HOME_SEARCH_VEL = -2.0
# Opposite sign to SEARCH: back off the switch, then latch on the release edge
# (ini-homing.adoc:151-153). One tenth of search speed for repeatability.
HOME_LATCH_VEL = 0.2
# HOME_OFFSET: coordinate assigned at the switch trip point
# (ini-config.adoc:1078, ini-homing.adoc:196-220). 0 puts the origin at the
# switch, making MIN_LIMIT = 0 above consistent.
HOME_OFFSET = 0.0
# HOME: where the joint ends up after homing (ini-config.adoc:1077).
HOME = 5.0
# Required because home and limit share one switch. See the shared note.
HOME_IGNORE_LIMITS = YES
# Home third, after Z is clear and Y has homed (ini-config.adoc:1112).
HOME_SEQUENCE = 2


# -----------------------------------------------------------------------------
[JOINT_1]
# Y axis. Same reasoning as JOINT_0 throughout; only the values differ.
# -----------------------------------------------------------------------------
TYPE = LINEAR

# From GRBL $101 = 823.500, empirically calibrated (docs/07). Note this is
# 1.2 % different from X's 833.3 despite nominally identical mechanics - which
# is what an honest empirical calibration looks like. Do not "tidy" them to
# match.
SCALE = 823.500

MAX_VELOCITY = 3.0
MAX_ACCELERATION = 10.0
STEPGEN_MAX_VEL = 3.6
STEPGEN_MAX_ACC = 12.0
BACKLASH = 0.000
FERROR = 0.050
MIN_FERROR = 0.005

# ASSUMPTION: 150 mm of usable Y travel. Same reasoning as JOINT_0 - GRBL's
#   $131 = 200 is a factory default. Resolved by measurement (docs/07 T1).
MIN_LIMIT = 0.0
MAX_LIMIT = 150.0

DIRSETUP = 50000
DIRHOLD = 50000
STEPLEN = 10000
STEPSPACE = 10000

# ASSUMPTION: Y homes toward the minimum end, sensor on gpio.022.
#   IO 22 is confirmed permanently-GPIO (printpd:104-105); which end it is at is
#   not. Resolved by halmeter, as for JOINT_0.
HOME_SEARCH_VEL = -2.0
HOME_LATCH_VEL = 0.2
HOME_OFFSET = 0.0
HOME = 5.0
HOME_IGNORE_LIMITS = YES
# Home second, after Z has lifted clear.
HOME_SEQUENCE = 1


# -----------------------------------------------------------------------------
[JOINT_2]
# Z axis. Note the different homing direction and the single sensor.
# -----------------------------------------------------------------------------
TYPE = LINEAR

# From GRBL $102 = 1250.000, empirically calibrated (docs/07).
SCALE = 1250.000

# Z's hardware ceiling is the lowest of the three - 9.6 mm/s at 12 kHz,
# because SCALE is highest. Still 3.0 for first run.
MAX_VELOCITY = 3.0
MAX_ACCELERATION = 10.0
STEPGEN_MAX_VEL = 3.6
STEPGEN_MAX_ACC = 12.0
BACKLASH = 0.000
FERROR = 0.050
MIN_FERROR = 0.005

# --- Z soft limits: sign convention differs from X and Y ------------------
# ASSUMPTION: 50 mm of usable Z travel, homing at the TOP.
#   docs/08 records that Z has only ONE sensor, at the top. Homing to the top
#   means the top is the origin and all usable travel is NEGATIVE (downward) -
#   the normal convention for a router Z. So MIN_LIMIT is negative and
#   MAX_LIMIT is 0, unlike X and Y above.
#   Resolved by: measure actual Z travel; docs/07 T1.
MIN_LIMIT = -50.0
MAX_LIMIT = 0.0

DIRSETUP = 50000
DIRHOLD = 50000
STEPLEN = 10000
STEPSPACE = 10000

# --- Z homing: UPWARD --------------------------------------------------
# ASSUMPTION: Z homes UP toward its single top sensor on gpio.024.
#   POSITIVE HOME_SEARCH_VEL, unlike X and Y. This is the whole reason Z homes
#   first: the tool must lift clear before X and Y move.
#   IO 24 is confirmed permanently-GPIO (printpd:108-109); that it is the TOP
#   sensor is not. Resolved by halmeter, as for JOINT_0.
HOME_SEARCH_VEL = 2.0
HOME_LATCH_VEL = -0.2
# Origin at the top switch, consistent with MAX_LIMIT = 0 above.
HOME_OFFSET = 0.0
# Come down 5 mm off the switch so the shared home/limit input is released.
# ini-config.adoc:1104 warns that if the switch is still toggled at the end of
# the home move you get a limit error immediately afterwards.
HOME = -5.0
HOME_IGNORE_LIMITS = YES
# Home FIRST - lift the tool clear before anything else moves.
HOME_SEQUENCE = 0


# =============================================================================
# AXES
# =============================================================================
# With trivkins these mirror the joints one-to-one. They are NOT redundant:
# joint limits abort joint motion, axis limits bound coordinated motion, and
# they are enforced at different stages. Keys documented at
# ini-config.adoc:915 (MAX_VELOCITY), :916 (MAX_ACCELERATION),
# :917 (MIN_LIMIT), :921 (MAX_LIMIT) - all machine units, per second,
# per second squared.
#
# These MUST stay numerically identical to the matching [JOINT_n]. If you raise
# a joint velocity, raise the axis too or the axis silently caps it.
# =============================================================================

# -----------------------------------------------------------------------------
[AXIS_X]
# -----------------------------------------------------------------------------
MAX_VELOCITY = 3.0
